name: ecommerce-ops-workbench

# 共享基础设施。
# - postgres：必需，后端 API 与单进程任务执行都依赖它。
# - minio：可选。仅当 ASSET_STORAGE_BACKEND=minio 时才需要（默认 local 落本地磁盘）。
#   不需要对象存储时可直接删除该服务，不影响任何功能。
# - redis / rabbitmq：已从项目中移除。任务执行改为单进程 eager（见 backend/app/core/config.py），
#   不再需要独立的 broker / result backend 容器。

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ops_command_center}
      POSTGRES_USER: ${POSTGRES_USER:-ops_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ops_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ops_admin} -d ${POSTGRES_DB:-ops_command_center}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-ops_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-ops_dev_password}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 8s
      retries: 5
    restart: unless-stopped

volumes:
  postgres-data:
  minio-data:
