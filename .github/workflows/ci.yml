name: CI

on:
  push:
    branches: [main, master, dev]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: uv sync --dev
      - name: Lint
        run: uv run ruff check .
      - name: Test
        # 失败时把 FAILED/ERROR 行与汇总写成 annotations：公开仓库的 job logs
        # 需要 admin 权限才能下载，annotations 可匿名读取，排障不必依赖网页登录。
        run: |
          set +e
          uv run pytest --tb=short -q > pytest-output.txt 2>&1
          code=$?
          if [ "$code" -ne 0 ]; then
            grep -E '^(FAILED|ERROR|[0-9]+ (failed|passed|error))' pytest-output.txt | while IFS= read -r line; do
              printf '::error::%s\n' "$line"
            done
          fi
          cat pytest-output.txt
          exit "$code"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Enable pnpm
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile || pnpm install
      - name: Lint
        run: pnpm lint
      - name: Type check
        run: pnpm typecheck
      - name: Build
        run: pnpm build
